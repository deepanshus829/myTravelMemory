---
- name: Configure MongoDB server
  hosts: database
  become: true

  tasks:

    - name: Add MongoDB repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/mongodb-org-8.0.repo
        mode: "0644"
        content: |
          [mongodb-org-8.0]
          name=MongoDB Repository
          baseurl=https://repo.mongodb.org/yum/amazon/2023/mongodb-org/8.0/x86_64/
          gpgcheck=1
          enabled=1
          gpgkey=https://pgp.mongodb.com/server-8.0.asc

    - name: Install MongoDB
      ansible.builtin.dnf:
        name: mongodb-org
        state: present

    - name: Enable MongoDB
      ansible.builtin.systemd:
        name: mongod
        enabled: true
        state: started

    - name: Configure MongoDB bind address
      ansible.builtin.lineinfile:
        path: /etc/mongod.conf
        regexp: '^  bindIp:'
        line: '  bindIp: 0.0.0.0'
      notify: Restart MongoDB

    - name: Enable MongoDB authorization
      ansible.builtin.blockinfile:
        path: /etc/mongod.conf
        marker: "# {mark} ANSIBLE MANAGED AUTH"
        block: |
          security:
            authorization: enabled
      notify: Restart MongoDB

    - name: Create MongoDB application user
      ansible.builtin.shell: |
        mongosh admin --eval '
        db.createUser({
          user: "{{ mongodb_username }}",
          pwd: "{{ mongodb_password }}",
          roles: [
            {
              role: "readWrite",
              db: "{{ mongodb_database }}"
            }
          ]
        })'
      register: mongo_user_result
      failed_when:
        - mongo_user_result.rc != 0
        - "'already exists' not in mongo_user_result.stdout"
      changed_when: "'Successfully added user' in mongo_user_result.stdout"

  handlers:

    - name: Restart MongoDB
      ansible.builtin.systemd:
        name: mongod
        state: restarted